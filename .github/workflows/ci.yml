name: Ayna checks
on:
  push:
    branches: [main, chore/bootstrap, 'feat/**', 'test/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install -r backend/requirements.lock
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: python -m scripts.export_openapi
        working-directory: backend
      - run: git diff --exit-code docs/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run types:api
        working-directory: frontend
      - run: git diff --exit-code frontend/src/shared/api-schema.d.ts
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: docker compose exec -T api python -m scripts.seed_shop
      - run: docker compose exec -T api python -m scripts.smoke
        env: {SMOKE_API_URL: 'http://localhost:8000'}
      - run: docker compose exec -T api python -m scripts.commerce_smoke
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker compose logs --no-color
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ayna-browser-results, path: frontend/test-results, retention-days: 7}
      - run: docker compose down
        if: always()
